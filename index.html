function shells(z){let rem=z;return [2,8,8,2].map(n=>{let v=Math.min(n,rem);rem-=v;return v}).filter(Boolean)}
function el(z){return {z,symbol:symbols[z-1],name:names[z-1],shells:z<=20?shells(z):[],group:group20[z-1],period:z<=2?1:z<=10?2:z<=18?3:4}}

const slides=[
{title:'Периодический закон',label:'01 / Введение',html:()=>`<h1>Периодический<br><span class="accent">закон</span></h1><p class="lead">Почему свойства элементов<br>повторяются?</p><div class="controls"><button class="primary" data-act="start">Начать исследование</button></div><p class="micro">12 разделов · интерактивные модели · тест</p>`,notes:'Начните с вопроса: что общего у лития, натрия и калия? Попросите учеников выдвинуть гипотезу. На схеме можно переключать атомы. К концу урока ученики объяснят повторяемость свойств через строение внешнего электронного слоя.',refs:[0,3]},
{title:'Открытие закона',label:'02 / История',html:()=>`<h2>Порядок среди<br>элементов</h2><p>В 1869 году <strong>Д. И. Менделеев</strong> связал повторение свойств с атомной массой и оставил места для ещё не открытых элементов.</p><div class="controls">${choice('history',0,'1869',S.history===0)}${choice('history',1,'1913',S.history===1)}</div><div class="controls portrait-switch" role="group" aria-label="Вид портрета">${choice('portrait','photo','Фотография',S.portrait==='photo')}${choice('portrait','3d','3D-портрет',S.portrait==='3d')}</div><div class="rule"><p id="historyExplain">${S.history===0?'Таблица позволила предсказывать свойства неизвестных элементов.':'Работы Генри Мозли показали фундаментальную роль атомного номера Z.'}</p></div>`,notes:'Периодический закон открыл Менделеев в 1869 году. В его исторической формулировке свойства связывались с атомными весами. Современная формулировка использует заряд ядра. Мозли в 1913 году исследовал характеристическое рентгеновское излучение. Он не сформулировал электронное объяснение периодичности в полном современном виде.',refs:[1,2,6,7]},
{title:'Современный закон',label:'03 / Главная идея',html:()=>`<h2>Свойства зависят<br>от заряда ядра</h2><p class="lead">Свойства химических элементов и их соединений находятся в периодической зависимости от <strong>заряда ядра атома</strong>.</p><div class="fact">Z = число протонов</div><p>В нейтральном атоме число электронов тоже равно Z.</p><div class="controls">${choice('order','z','Порядок по Z',S.order==='z')}${choice('order','mass','По атомной массе',S.order==='mass')}</div><p class="micro">Сравните Ar и K: возрастание массы не всегда совпадает с порядком в таблице.</p>`,notes:'Объясните различие Z и относительной атомной массы Ar. Заряд ядра равен +Ze. При записи +16 для серы имеется в виду заряд в единицах элементарного заряда. У аргона относительная атомная масса около 39,95, у калия около 39,10. Тем не менее Ar (Z=18) стоит перед K (Z=19).',refs:[0,5]},
{title:'Периоды и группы',label:'04 / Карта элементов',html:()=>`<h2>Адрес элемента<br>в таблице</h2><p><strong>7 периодов</strong> идут по горизонтали.<br><strong>18 групп</strong> идут по вертикали.</p><div class="controls">${choice('tableMode','period','Период',S.tableMode==='period')}${choice('tableMode','group','Группа',S.tableMode==='group')}</div><div class="rule" id="tableInfo">${tableInfo()}</div><p class="micro">Нажмите на любой элемент. Для большой таблицы можно скрыть текст. На телефоне таблица прокручивается вбок.</p>`,notes:'Номер периода совпадает с наибольшим главным квантовым числом занятого уровня в основном состоянии. В школьной модели для первых 20 элементов это число занятых электронных слоёв. Для элементов главных групп связь номера группы и внешних электронов проста, но её нельзя переносить на все переходные элементы. Лантаноиды и актиноиды вынесены в два ряда. Принадлежность элементов к группе 3 здесь не рассматривается.',refs:[0,3]},
{title:'Строение атома',label:'05 / Электронные слои',html:()=>{const e=el(S.atom);return `<h2>Электроны<br>по слоям</h2><p>Положение элемента связано с распределением электронов в атоме.</p><label class="control-label" for="atomRange">Порядковый номер Z <output id="atomOut">${S.atom}</output></label><input type="range" id="atomRange" min="1" max="20" value="${S.atom}" aria-label="Порядковый номер элемента, от 1 до 20"><div class="rule"><div class="fact" id="atomInfo">${e.name}: ${e.shells.join(' · ')}</div><p id="atomConfig">${configs[S.atom-1]}</p><p id="atomDetail">Период ${e.period}. Электронов во внешнем слое: ${e.shells.at(-1)}.</p></div><p class="micro">Модель для первых 20 элементов. Окружности условно обозначают слои, а не траектории электронов.</p>`}},
{title:'Причина периодичности',label:'06 / Повторение строения',html:()=>`<h2>Внешний слой<br>повторяется</h2><p>Во 2-м и 3-м периодах число внешних электронов последовательно меняется <strong>от 1 до 8</strong>.</p><p>Элементы одной главной группы имеют сходное строение внешнего слоя и сходные химические свойства.</p><label class="control-label" for="familyRange">Внешних электронов <output id="familyOut">${S.family}</output></label><input id="familyRange" type="range" min="1" max="8" value="${S.family}" aria-label="Число внешних электронов от 1 до 8"><p class="micro">Сравните элементы на одной вертикали.</p>`,notes:'Второй период Li–Ne и третий период Na–Ar: внешняя оболочка последовательно заполняется от одного до восьми электронов. В ряду O/S по шесть внешних электронов, F/Cl по семь. Сходство свойств не означает полного совпадения. В первом периоде у He завершённый слой содержит два электрона.',refs:[3]},
{title:'Закономерности в периоде',label:'07 / Слева направо',html:()=>`<h2>Свойства<br>в периоде</h2><p>На примере 3-го периода: от Na к Cl заряд ядра растёт, а новые электроны занимают <strong>тот же внешний слой</strong>.</p><div class="controls">${choice('trend',0,'Размер атома',S.trend===0)}${choice('trend',1,'Свойства',S.trend===1)}</div><div class="rule"><p>${S.trend===0?'В целом атомный радиус уменьшается: ядро сильнее притягивает электроны.':'Металлические свойства ослабевают, неметаллические усиливаются. Электроотрицательность в целом растёт.'}</p></div><p class="micro">Общие тенденции для элементов главных групп. Размеры показаны условно, без числового масштаба.</p>`,notes:'В пределах периода увеличивается эффективное притяжение внешних электронов к ядру. На схеме показана общая тенденция размеров, это не набор измеренных радиусов. В режиме «Свойства» показан ряд Na–Cl: слева металлы, кремний занимает промежуточное положение, справа неметаллы. Электроотрицательность — способность атома притягивать общую электронную пару в химической связи. Благородный газ Ar не включён в сравнение электроотрицательности.',refs:[4]},
{title:'Закономерности в группе',label:'08 / Сверху вниз',html:()=>`<h2>Свойства<br>в группе</h2><p>У Li, Na и K по <strong>одному электрону</strong> на внешнем слое. При движении вниз добавляются электронные слои.</p><div class="controls">${[3,11,19].map(z=>choice('group',z,symbols[z-1],S.group===z)).join('')}</div><div class="rule"><p>Радиус атома в целом увеличивается. В группе щелочных металлов электрон легче отдать, металлические свойства усиливаются.</p></div><p class="micro">Выберите элемент и сравните число слоёв. Геометрия модели условная.</p>`,notes:'У лития распределение 2,1, у натрия 2,8,1, у калия 2,8,8,1. Внешний электрон находится дальше от ядра и сильнее экранирован внутренними электронами. В группе 1 при движении вниз первая энергия ионизации уменьшается и металлические свойства усиливаются.',refs:[3,4]},
{title:'Характеристика серы',label:'09 / Разбор примера',html:()=>`<h2>Что таблица<br>расскажет о сере</h2><p>Сера, <strong>S</strong>, имеет порядковый номер <strong>16</strong>. По её положению можно описать строение атома и важные соединения.</p><div class="controls">${['Адрес','Электроны','Соединения'].map((t,i)=>choice('sulfur',i,t,S.sulfur===i)).join('')}</div><div class="rule"><p>${['3-й период, 16-я группа. Сера относится к неметаллам.','В нейтральном атоме 16 электронов. По слоям: 2, 8, 6. Внешний слой: 3s² 3p⁴.','Характерные степени окисления: −2, +4, +6. Высший оксид: SO₃. Ему соответствует H₂SO₄.'][S.sulfur]}</p></div>`,notes:'Можно дополнить пример: летучее водородное соединение серы — H₂S. Высший оксид SO₃ — кислотный, соответствующий гидроксид — серная кислота H₂SO₄. Степень окисления и валентность — разные понятия. Перечень −2, +4, +6 содержит характерные, а не все возможные степени окисления серы.',refs:[0,3]},
{title:'Неизвестный элемент',label:'10 / Задание',html:()=>`<h2>Какой элемент<br>скрыт за знаком?</h2><p>У атома <strong>3 электронных слоя</strong> и <strong>2 электрона во внешнем слое</strong>. Рассматриваем элементы первых трёх периодов.</p><div class="controls">${[12,20,13].map(z=>choice('mystery',z,symbols[z-1],S.mystery===z)).join('')}</div><div class="rule"><p id="mysteryFeedback">${mysteryFeedback()}</p></div>`,notes:'Правильный ответ: Mg, магний. Он находится в 3-м периоде, во 2-й группе, распределение электронов 2,8,2, Z=12. У Ca четыре слоя, у Al три внешних электрона. Попросите учеников назвать формулу оксида MgO и его основной характер.',refs:[0,3]},
{title:'Проверка знаний',label:'11 / Пять вопросов',html:()=>`<h2>Проверка<br>понимания</h2><p>Выберите один ответ. После выбора появится объяснение.</p><p>Результат учитывает первый ответ на каждый вопрос.</p>`,notes:'Вопросы проверяют современную формулировку закона, связь Z с числом протонов, определение периода, тренд радиуса и причину сходства элементов одной группы. Для коллективной работы попросите учеников сначала объяснить выбор, затем нажмите ответ. Кнопка «Ещё раз» сбрасывает результат.',refs:[0,3,4]},
{title:'Главное и источники',label:'12 / Итоги',html:()=>`<h2>Закон помогает<br>предсказывать</h2><p class="lead">Место элемента в таблице связывает строение атома с его свойствами.</p><div class="controls"><button class="primary" data-act="sources">Источники</button><button class="choice" data-act="restart">К началу</button></div><p class="micro">Для самостоятельной работы: составьте характеристику фосфора по образцу серы.</p>`,notes:'Итог урока: порядковый номер показывает число протонов, периодичность возникает из повторения строения внешних электронных слоёв. Попросите ученика объяснить один тренд через строение атома. Домашнее задание по фосфору: Z=15, период 3, группа 15, слои 2,8,5, неметалл, высшая степень окисления +5. Можно обсудить P₄O₁₀, который в школьных задачах также записывают эмпирической формулой P₂O₅.',refs:[0,3,4]}
];

function periodDescription(z,tab){const e=el(z),p=periodProfiles[z];if(tab===0)return `<div class="fact">3-й период · ${p.group}-я группа</div><p>${p.kind}. Порядковый номер Z = ${z}. Заряд ядра +${z}e.</p>`;if(tab===1)return `<div class="fact">${e.shells.join(' · ')}</div><p>В нейтральном атоме ${z} электронов. Во внешнем слое: <strong>${e.shells.at(-1)}</strong>.</p><p class="period-config">${configs[z-1]}</p>`;return `<p>Характерные степени окисления: <strong>${p.oxidation}</strong>.</p><p>${p.compounds}</p>`}

function drawThirdPeriod(){const {w,h,mobile,x,y,aw,ah}=bounds();let content='';if(S.periodDetail){const z=S.periodDetail,e=el(z),profile=periodProfiles[z],r=Math.min(aw*.31,ah*.43);content=atom(z,x,y,r);const caption=S.periodTab===0?`3-й период / ${profile.group}-я группа`:S.periodTab===1?`${e.shells.join(' · ')} / ${configs[z-1]}`:profile.visual.join(' / ');content+=text(x,y+r+(mobile?27:48),caption,mobile?(S.periodTab===1?15:19):29,S.periodTab===2?C.gold:C.mint);$('visual').innerHTML=svg(content,`Атом ${e.name}, ${['адрес в таблице','электронное строение','соединения'][S.periodTab]}`)}else{const count=8,spacing=mobile?w/4:aw/8.1;for(let i=0;i<count;i++){const z=11+i,cx=mobile?(i%4+.5)*spacing:x+(i-3.5)*spacing,cy=mobile?(S.closed?h*.3:h*.22)+Math.floor(i/4)*(S.closed?h*.3:h*.15):y,r=mobile?Math.min(spacing*.35,h*.043):Math.min(spacing*.35,ah*.22);let figure=atom(z,cx,cy,r);figure+=text(cx,cy+r+(mobile?22:30),`${i+1} e⁻`,mobile?13:17,C.mint);figure+=`<rect x="${cx-spacing*.47}" y="${cy-r-40}" width="${spacing*.94}" height="${r*2+80}" fill="transparent"/>`;content+=actionGroup(figure,'periodOpen',z,`${names[z-1]} ${symbols[z-1]}: открыть характеристики`)}if(!mobile)content+=text(x,y+Math.min(spacing*.35,ah*.22)+90,'3-й период: Na, Mg, Al, Si, P, S, Cl, Ar',18,C.muted);$('visual').innerHTML=svg(content,'Восемь атомов третьего периода: натрий, магний, алюминий, кремний, фосфор, сера, хлор и аргон').replace('role="img"','role="group"')}NuclearView.sync(nuclei,'all')}
function drawVerticalGroup(){const {w,h,mobile,aw}=bounds(),top=mobile?(S.closed?150:155):Math.max(170,h*.24),bottom=mobile?(S.closed?h-170:h*.42):h*.72,step=(bottom-top)/2,baseRadius=Math.min(step*.35,aw*.14),cx=mobile?w*.35:S.closed?w*.43:w*.61,labelX=cx+baseRadius+(mobile?22:65);let content='';[3,11,19].forEach((z,i)=>{const cy=top+i*step,r=baseRadius*(.7+.15*i),active=S.group===z;if(active)content+=`<circle cx="${cx}" cy="${cy}" r="${r+9}" fill="none" stroke="#8de5c435" stroke-dasharray="3 5"/>`;content+=atom(z,cx,cy,r,false);content+=text(labelX,cy-2,`${symbols[z-1]} · ${names[z-1]}`,mobile?18:27,active?C.mint:C.fg,'start');content+=text(labelX,cy+(mobile?21:31),el(z).shells.join(' · '),mobile?14:20,C.muted,'start');content+=actionGroup(`<rect x="${cx-r-12}" y="${cy-step*.44}" width="${Math.min(w-cx+r-24,aw*.6)}" height="${step*.88}" fill="transparent"/>`,'group',z,`Выбрать ${names[z-1]}`)});if(!mobile){const ax=cx-baseRadius-55;content+=line(ax,top-15,ax,bottom+15,C.mint,1.5)+`<path d="M ${ax-6} ${bottom+5} l 6 10 6 -10" fill="none" stroke="${C.mint}" stroke-width="1.5"/>`;content+=text(cx+70,bottom+baseRadius+65,'Вниз по группе: больше слоёв и больше радиус',16,C.muted)}$('visual').innerHTML=svg(content,'Группа 1 сверху вниз: литий, натрий, калий').replace('role="img"','role="group"');NuclearView.sync(nuclei,'all')}
function drawHistory(){const person=S.history===0?'mendeleev':'moseley',name=S.history===0?'Д. И. Менделеев':'Генри Мозли',photo=S.portrait==='photo';$('visual').innerHTML=`<figure class="historian ${photo?'photo':'bust'}"><img src="assets/${person}-${photo?'photo.jpg':'3d.png'}" alt="${photo?'Историческая фотография':'Стилизованная 3D-иллюстрация'}: ${name}" draggable="false"></figure><div class="historian-meta"><div class="historian-event"><span>${S.history===0?'1869':'1913'}</span><div><strong>${name}</strong><p>${S.history===0?'Открытие периодического закона':'Исследование атомного номера'}</p></div></div><div class="portrait-credit">${photo?(S.history===0?'Фото: 1890-е годы · Wikimedia Commons':'Фото: 1914 год · AIP / Wikimedia Commons'):'Стилизованная 3D-иллюстрация по исторической фотографии'}</div></div>`}
function drawNucleusCloseup(){const {w,h,mobile,x,y,aw,ah}=bounds(),z=S.atom,r=Math.min(aw*(mobile?(S.closed?.39:.26):.25),ah*(mobile?.4:.38));nuclei=[{z,cx:x,cy:y,r}];const sub=`<g>${nuclearFallback(z,x,y,r)}<circle cx="${x}" cy="${y}" r="${r*1.1}" fill="transparent" data-nucleus="true" role="img" aria-label="Ядро ${names[z-1]}. Перетащите для вращения" style="cursor:grab;touch-action:none"/></g>`;$('visual').innerHTML=svg(sub,`3D-модель ядра ${names[z-1]}`)+`<div class="nucleus-detail" style="left:${x}px;top:${y+r+24}px"><strong>${symbols[z-1]}-${NuclearView.masses[z-1]}</strong><span><i class="particle red"></i>${z} p⁺ <i class="particle blue"></i>${NuclearView.masses[z-1]-z} n⁰</span></div><div class="model-tools" style="left:${x}px;top:${y+r+(mobile?77:105)}px"><button class="quiet" data-act="rotate" data-value="left" aria-label="Повернуть ядро влево">↶</button><span class="webgl-instruction">Можно повернуть вручную</span><span class="fallback-instruction">Упрощённая схема: 3D недоступно</span><button class="quiet" data-act="rotate" data-value="right" aria-label="Повернуть ядро вправо">↷</button><button class="quiet" data-act="rotate" data-value="reset" aria-label="Сбросить ракурс">Сброс</button></div>`;NuclearView.sync(nuclei,S.nucleusFocus)}
const nonmetal=new Set([1,5,6,7,8,9,14,15,16,17,32,33,34,35,51,52,53,85,117]);
function drawTable(){const sel=positions.find(e=>e.z===S.table);let html='<div class="table-scroll" tabindex="0" aria-label="Таблица элементов. На узком экране прокручивается по горизонтали"><div class="ptable">';for(let g=1;g<=18;g++)html+=`<span class="table-label" style="grid-column:${g+1};grid-row:1">${g}</span>`;for(let p=1;p<=7;p++)html+=`<span class="table-label" style="grid-column:1;grid-row:${p+1}">${p}</span>`;
positions.forEach(d=>{const noble=[2,10,18,36,54,86,118].includes(d.z),rare=!d.g;const high=S.tableMode==='period'?d.p===sel.p:sel.g?d.g===sel.g:!d.g&&d.p===sel.p;html+=`<button class="element ${noble?'noble':rare?'rare':nonmetal.has(d.z)?'nonmetal':''} ${!high?'dim':''} ${d.z===S.table?'selected':''}" data-act="table" data-value="${d.z}" style="grid-column:${d.col};grid-row:${d.row}" aria-label="${names[d.z-1]}, ${symbols[d.z-1]}, Z ${d.z}, период ${d.p}${d.g?', группа '+d.g:''}" aria-pressed="${S.table===d.z}"><small>${d.z}</small><b>${symbols[d.z-1]}</b></button>`});html+='<span class="table-placeholder" style="grid-column:4;grid-row:7">57–71</span><span class="table-placeholder" style="grid-column:4;grid-row:8">89–103</span></div></div><div class="legend"><span>Металлы</span><span>Неметаллы и полуметаллы</span><span>Группа 18</span><span>Вынесенные ряды</span></div>';$('visual').innerHTML=html}
function drawQuiz(){let html='';if(S.q===5){const score=S.answers.reduce((sum,v,i)=>sum+(v===questions[i].correct),0);html=`<div class="quiz-step">ТЕСТ ЗАВЕРШЁН</div><div class="badge-result">${score}<span style="font-size:.4em;color:var(--muted)"> / 5</span></div><h3>${score===5?'Все ответы верны':score>=3?'Основные идеи понятны':'Вернёмся к главным идеям'}</h3><p class="feedback">${score===5?'Теперь попробуйте объяснить закономерности своими словами.':'Разберите объяснения к вопросам и повторите нужные разделы.'}</p><button class="primary" data-act="quizReset">Ещё раз</button>`}else{const q=questions[S.q],answer=S.answers[S.q];html=`<div class="quiz-step">ВОПРОС ${S.q+1} ИЗ 5</div><h3>${q.q}</h3><div class="answers">${q.a.map((a,i)=>`<button class="answer ${answer!==null?(i===q.correct?'correct':i===answer?'wrong':''):''}" data-act="answer" data-value="${i}" ${answer!==null?'disabled':''}><span>0${i+1}</span>${a}</button>`).join('')}</div>${answer!==null?`<p class="feedback" role="status"><strong style="color:${answer===q.correct?'var(--mint)':'var(--gold)'}">${answer===q.correct?'Верно.':'Правильный ответ выделен зелёным.'}</strong> ${q.why}</p><button class="primary" data-act="quizNext">${S.q===4?'Результат':'Следующий вопрос'}</button>`:''}`}$('visual').innerHTML=`<div class="quiz-area fade-in" aria-label="Тест">${html}</div>`}
function panel(){const d=slides[current];$('panel').className='copy-panel'+(current===0?' cover':'');$('panel').innerHTML=`<div class="chapter">${d.label}</div>`+d.html()+(current>=10?`<button class="collapse" data-act="collapse" aria-controls="panel">Скрыть текст · T</button>`:'');$('panel').hidden=S.closed;$('restore').hidden=current>=10&&!S.closed;$('restore').textContent=S.closed?'Показать текст · T':'Скрыть текст · T';$('restore').setAttribute('aria-expanded',String(!S.closed))}
function render(){const d=slides[current];$('scene').className='scene'+(S.closed?' collapsed':'')+(current===4&&S.atomView==='nucleus'?' nucleus-closeup':'')+([10,11].includes(current)?' editorial':'');$('scene').setAttribute('aria-label',`Слайд ${current+1} из 12: ${d.title}`);panel();draw();$('counter').innerHTML=`<strong>${String(current+1).padStart(2,'0')}</strong> / 12`;$('prev').disabled=current===0;$('next').disabled=current===11;$('nextLabel').textContent=current<11?slides[current+1].title:'';$('progress').innerHTML=slides.map((s,i)=>`<button class="dot ${i===current?'active':i<current?'passed':''}" data-act="go" data-value="${i}" title="${i+1}. ${s.title}" aria-label="Слайд ${i+1}: ${s.title}" ${i===current?'aria-current="step"':''}></button>`).join('');$('announce').textContent=`Слайд ${current+1}. ${d.title}`;document.title=d.title+' · Химия, 10 класс'}
function go(index){index=Math.max(0,Math.min(11,index));if(index===current)return;current=index;history.replaceState(null,'','#'+(current+1));render();$('next').focus({preventScroll:true})}
function closePanel(){S.closed=!S.closed;$('scene').classList.toggle('collapsed',S.closed);$('panel').hidden=S.closed;$('restore').hidden=current>=10&&!S.closed;$('restore').textContent=S.closed?'Показать текст · T':'Скрыть текст · T';$('restore').setAttribute('aria-expanded',String(!S.closed));draw();if(!$('restore').hidden)$('restore').focus({preventScroll:true});else $('notesBtn').focus({preventScroll:true})}
function showDialog(kind){modalReturn=document.activeElement;const d=slides[current];if(kind==='menu'){$('dialogTitle').textContent='Содержание';$('dialogContent').innerHTML='<div class="menu-grid">'+slides.map((s,i)=>`<button class="menu-item" data-act="menuGo" data-value="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</button>`).join('')+'</div><p class="micro">← → — слайды · T — текст · F — полный экран · N — заметки · Esc — закрыть окно</p>'}else if(kind==='sources'){$('dialogTitle').textContent='Источники';$('dialogContent').innerHTML='<div class="source-list">'+sources.map(s=>`<div><a href="${s[1]}" target="_blank" rel="noopener noreferrer">${s[0]} ↗</a><p>${s[2]}</p></div>`).join('')+'<div><a href="https://periodic-table.rsc.org/element/19/potassium" target="_blank" rel="noopener noreferrer">RSC · Калий ↗</a></div></div><p>Учебные модели атомов, ядер и размеров условны. Стилизованные 3D-портреты созданы с помощью ИИ по историческим фотографиям и не являются документальными изображениями. Источники доступны при подключении к интернету, сама презентация работает без сети.</p>'}else{$('dialogTitle').textContent=`Заметки · ${current+1}/12`;$('dialogContent').innerHTML=`<p style="color:var(--gold);font-size:13px">Заметки видны на текущем экране, в том числе зрителям при трансляции.</p><h3>${d.title}</h3><p>${d.notes||''}</p><p class="micro">Источники для этого раздела:</p>`+(d.refs||[]).map(i=>`<p><a href="${sources[i][1]}" target="_blank" rel="noopener noreferrer">${sources[i][0]} ↗</a></p>`).join('')}
$('dialog').hidden=false;$('scene').inert=true;document.querySelector('.topbar').inert=true;document.querySelector('.footer').inert=true;$('closeDialog').focus()}
function closeDialog(){$('dialog').hidden=true;$('scene').inert=false;document.querySelector('.topbar').inert=false;document.querySelector('.footer').inert=false;if(modalReturn?.isConnected)modalReturn.focus({preventScroll:true})}
function toast(message){clearTimeout(noticeTimer);$('notice').textContent=message;$('notice').hidden=false;noticeTimer=setTimeout(()=>$('notice').hidden=true,4500)}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else toast('Полный экран недоступен. Используйте режим показа браузера.')}catch{toast('Браузер не разрешил полный экран. Откройте файл в отдельной вкладке.')}}
function handleAction(a,value){const n=Number(value);if(a==='go')go(n);else if(a==='menuGo'){closeDialog();go(n)}else if(a==='start')go(1);else if(a==='restart')go(0);else if(a==='collapse')closePanel();else if(a==='sources')showDialog('sources');else if(a==='periodOpen'){if(!periodProfiles[n])return;S.periodDetail=n;S.periodTab=0;S.closed=false;$('scene').classList.remove('collapsed');panel();draw();$('panel').querySelector('[data-act=periodTab]')?.focus({preventScroll:true})}else if(a==='periodTab'){S.periodTab=n;panel();draw();$('panel').querySelector(`[data-act=periodTab][data-value="${n}"]`)?.focus({preventScroll:true})}else if(a==='periodBack'){const previous=S.periodDetail;S.periodDetail=null;panel();draw();$('visual').querySelector(`[data-act=periodOpen][data-value="${previous}"]`)?.focus({preventScroll:true})}else if(a==='spin'){NuclearView.setAuto(!NuclearView.info().autoRotation)}else if(a==='rotate'){if(NuclearView.info().renderer==='fallback'){toast('3D недоступно в этом браузере. Показана упрощённая схема.');return}if(value==='reset')NuclearView.reset();else NuclearView.rotate(value==='left'?-.28:.28,0)}else if(a==='answer'){if(S.answers[S.q]===null){S.answers[S.q]=n;drawQuiz();$('visual').querySelector('[data-act=quizNext]')?.focus({preventScroll:true})}}else if(a==='quizNext'){S.q=Math.min(5,S.q+1);drawQuiz();$('visual').querySelector('button')?.focus({preventScroll:true})}else if(a==='quizReset'){S.q=0;S.answers=Array(5).fill(null);drawQuiz()}else if(['cover','history','table','family','trend','group','sulfur','mystery','order','tableMode','portrait','atomView','nucleusFocus'].includes(a)){S[a]=['order','tableMode','portrait','atomView','nucleusFocus'].includes(a)?value:n;$('scene').classList.toggle('nucleus-closeup',current===4&&S.atomView==='nucleus');const scroll=$('visual').querySelector('.table-scroll')?.scrollLeft||0;panel();draw();if(a==='table'){$('visual').querySelector('.table-scroll').scrollLeft=scroll;$('visual').querySelector('.element.selected')?.focus({preventScroll:true})}else if(a!=='cover'&&a!=='family'&&a!=='group')$('panel').querySelector(`[data-act="${a}"][data-value="${value}"]`)?.focus({preventScroll:true})}}
document.addEventListener('click',e=>{const node=e.target.closest('[data-act]');if(node&&!node.disabled)handleAction(node.dataset.act,node.dataset.value)});
document.addEventListener('input',e=>{if(e.target.id==='atomRange'){S.atom=+e.target.value;const z=S.atom,d=el(z);$('atomOut').value=z;$('atomInfo').textContent=`${d.name}: ${d.shells.join(' · ')}`;$('atomConfig').textContent=configs[z-1];$('atomDetail').textContent=`Период ${d.period}. Внешних электронов: ${d.shells.at(-1)}.`;$('nucleusInfo').textContent=isotopeInfo(z);draw()}if(e.target.id==='familyRange'){S.family=+e.target.value;$('familyOut').value=S.family;draw()}});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('restore').onclick=closePanel;$('menuBtn').onclick=()=>showDialog('menu');$('notesBtn').onclick=()=>showDialog('notes');$('fullscreenBtn').onclick=fullscreen;$('closeDialog').onclick=closeDialog;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))closeDialog()});
document.addEventListener('keydown',e=>{if(!$('dialog').hidden){if(e.key==='Escape'){e.preventDefault();closeDialog()}if(e.key==='Tab'){const focusable=[...$('dialog').querySelectorAll('a,button')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='Escape'&&current===5&&S.periodDetail){e.preventDefault();handleAction('periodBack');return}if(e.target.matches('input,select,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.closest('g[data-act]')&&['Enter',' '].includes(e.key)){e.preventDefault();const t=e.target.closest('g[data-act]');handleAction(t.dataset.act,t.dataset.value);return}if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(11)}if(e.key.toLowerCase()==='t'||e.key.toLowerCase()==='е'){e.preventDefault();closePanel()}if(e.key.toLowerCase()==='f'||e.key.toLowerCase()==='а'){e.preventDefault();fullscreen()}if(e.key.toLowerCase()==='n'||e.key.toLowerCase()==='т'){e.preventDefault();showDialog('notes')}});
let nuclearDrag=null;
document.addEventListener('pointerdown',e=>{const hit=e.target.closest('[data-nucleus]');if(!hit)return;nuclearDrag={id:e.pointerId,x:e.clientX,y:e.clientY};NuclearView.setDragging(true);hit.setPointerCapture?.(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!nuclearDrag||e.pointerId!==nuclearDrag.id)return;NuclearView.rotate((e.clientX-nuclearDrag.x)*.012,(e.clientY-nuclearDrag.y)*.012);nuclearDrag.x=e.clientX;nuclearDrag.y=e.clientY});
for(const name of ['pointerup','pointercancel'])document.addEventListener(name,e=>{if(nuclearDrag?.id===e.pointerId){nuclearDrag=null;NuclearView.setDragging(false)}});
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(draw,80)});const start=Number(location.hash.slice(1));if(Number.isInteger(start)&&start>=1&&start<=12)current=start-1;render();
</script>
